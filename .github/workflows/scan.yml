name: Daily job scan

on:
  schedule:
    # every 4 hours, anchored on 9:00 AM Laos time (UTC+7):
    # 02,06,10,14,18,22 UTC = 09:00, 13:00, 17:00, 21:00, 01:00, 05:00 Laos
    - cron: '0 2,6,10,14,18,22 * * *'
  workflow_dispatch:       # manual "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scanner
        run: node scanner.js

      - name: Publish data to Pages folder
        run: |
          mkdir -p docs/data
          cp data/jobs.json data/meta.json docs/data/

      - name: Commit results
        run: |
          git config user.name "ezjobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
